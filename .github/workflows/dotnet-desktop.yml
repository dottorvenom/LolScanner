name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  Solution_Name: your-solution-name.sln
  Wap_Project_Directory: your-wap-project-directory
  Wap_Project_Path: your-wap-project-path.wapproj

jobs:
  build-release:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

    - name: Run tests
      run: dotnet test --configuration Release

    - name: Decode signing certificate
      shell: pwsh
      run: |
        $pfx = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path $env:Wap_Project_Directory "GitHubActionsWorkflow.pfx"
        [System.IO.File]::WriteAllBytes($certificatePath, $pfx)

    - name: Build MSIX
      run: |
        msbuild $env:Wap_Project_Path `
        /p:Configuration=Release `
        /p:UapAppxPackageBuildMode=StoreUpload `
        /p:AppxBundle=Always `
        /p:AppxBundlePlatforms="x86|x64" `
        /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx `
        /p:PackageCertificatePassword=${{ secrets.Pfx_Key }}

    - name: Remove certificate
      run: Remove-Item $env:Wap_Project_Directory\GitHubActionsWorkflow.pfx

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MSIX
        path: ${{ env.Wap_Project_Directory }}\AppPackages

    - name: Zip package
      shell: pwsh
      run: |
        Compress-Archive `
          -Path "${{ env.Wap_Project_Directory }}\AppPackages\*" `
          -DestinationPath "release.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        generate_release_notes: true
        files: |
          release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
