name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  Solution_Name: LolScanner.sln
  # Correggi questi percorsi con quelli reali del tuo progetto
  Wap_Project_Directory: LolScanner
  Wap_Project_Path: LolScanner\LolScanner.wapproj

jobs:
  build-release:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

    - name: Run tests
      run: dotnet test --configuration Release

    - name: Decode signing certificate
      shell: pwsh
      if: env.Base64_Encoded_Pfx != ''  # Salta se il secret non è impostato
      run: |
        $pfx = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path $env:GITHUB_WORKSPACE "GitHubActionsWorkflow.pfx"
        [System.IO.File]::WriteAllBytes($certificatePath, $pfx)
        echo "CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

    - name: Build MSIX
      run: |
        msbuild $env:Wap_Project_Path `
        /p:Configuration=Release `
        /p:UapAppxPackageBuildMode=StoreUpload `
        /p:AppxBundle=Always `
        /p:AppxBundlePlatforms="x86|x64" `
        /p:PackageCertificateKeyFile=$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx `
        /p:PackageCertificatePassword=${{ secrets.Pfx_Key }}

    - name: Remove certificate
      if: always()  # Rimuovi sempre, anche se il build fallisce
      run: |
        if (Test-Path "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx") {
          Remove-Item "$env:GITHUB_WORKSPACE\GitHubActionsWorkflow.pfx"
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MSIX
        path: ${{ env.Wap_Project_Directory }}\AppPackages

    - name: Zip package
      shell: pwsh
      run: |
        $appPackagesPath = Join-Path $env:Wap_Project_Directory "AppPackages"
        if (Test-Path $appPackagesPath) {
          Compress-Archive `
            -Path "$appPackagesPath\*" `
            -DestinationPath "release.zip" `
            -Force
        } else {
          Write-Host "::warning::AppPackages directory not found"
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        generate_release_notes: true
        files: |
          release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}